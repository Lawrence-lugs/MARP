name: Test (via cached container)

on: [push, pull_request]

permissions:
  contents: read
  packages: read
  

env:
  IMAGE: ghcr.io/lawrence-lugs/marp

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Determine image tag
        id: tag
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_sha }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull devcontainer image
        run: |
          docker pull \
            ${{ env.IMAGE }}:latest

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive

      - name: Run pytest inside container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspaces/MARP" \
            -w /workspaces/MARP \
            -e MPLBACKEND=Agg \
            ${{ env.IMAGE }}:latest \
            bash -c "git config --global --add safe.directory /workspaces/MARP && pip install -e third_party/zigzag && pip install -e '.[dev]' && pytest tests/"
