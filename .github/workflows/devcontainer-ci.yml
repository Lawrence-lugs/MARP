name: CI (devcontainer)

on: [push, pull_request]

env:
  IMAGE: ghcr.io/lawrence-lugs/marp/marp-tools

jobs:

  # ── 0. Detect which paths changed ────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      devcontainer: ${{ steps.filter.outputs.devcontainer }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            devcontainer:
              - '.devcontainer/**'

  # ── 1. Build container image (only when .devcontainer changes) ───────────────
  docker:
    name: Build container
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (GH)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest
          pull: true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build devcontainer image
        run: |
          docker build \
            --file .devcontainer/Dockerfile \
            --tag marp-devcontainer:ci \
            .

      - name: Run pytest inside container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspaces/MARP" \
            -w /workspaces/MARP \
            -e MPLBACKEND=Agg \
            marp-devcontainer:ci \
            bash -c "git config --global --add safe.directory /workspaces/MARP && pip install -e third_party/zigzag && pip install -e '.[dev]' && pytest tests/"
